[project]
name = "openelm-local-agent"
version = "0.1.0"
description = "Local multi-project OpenELM agent with grounded ChromaDB RAG and safe tools"
requires-python = ">=3.10,<3.13"
dependencies = [
  "chromadb>=0.5,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mlx-lm>=0.20,<1",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.12,<1",
  "sentence-transformers>=3,<6",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
local-ai = "local_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["local_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

