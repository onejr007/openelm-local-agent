<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADI Local AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0f1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #2d333b; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #444c56; }
    pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

  <!-- Offline Warning Banner -->
  <div id="offlineBanner" class="hidden bg-rose-950/90 border-b border-rose-800 text-rose-200 px-4 py-2 text-xs flex items-center justify-between z-50">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
      <span><strong>AI Server Terputus / Berhenti.</strong> Sistem AI sedang offline.</span>
    </div>
    <button onclick="startAiServer()" id="bannerStartBtn" class="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white font-medium rounded transition flex items-center gap-1.5 shadow">
      <i class="fa-solid fa-play text-[10px]"></i>
      <span>Jalankan Manual</span>
    </button>
  </div>

  <!-- Header: Minimalist & Clean -->
  <header class="h-13 border-b border-[#21262d] bg-[#161b22] flex items-center justify-between px-5 py-2.5 z-10">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-semibold text-xs text-cyan-400">
        AI
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-semibold text-sm tracking-tight text-slate-100">ADI Local AI</h1>
          <!-- Status Pill -->
          <div id="statusPill" class="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-emerald-950/70 border border-emerald-800 text-emerald-400 text-[11px] font-medium">
            <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            <span id="statusText">Online</span>
          </div>
        </div>
        <p class="text-[11px] text-slate-400">Bagas Adi Pratama &bull; OpenELM Local</p>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center gap-2">
      <button onclick="restartAiServer()" title="Restart AI Engine" class="p-1.5 px-2.5 text-xs text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 rounded border border-transparent hover:border-slate-700 transition flex items-center gap-1.5">
        <i class="fa-solid fa-rotate-right text-[11px]"></i>
        <span class="hidden sm:inline text-xs">Restart</span>
      </button>
      <button onclick="clearChat()" title="Bersihkan Percakapan" class="p-1.5 px-2.5 text-xs text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 rounded border border-transparent hover:border-slate-700 transition flex items-center gap-1.5">
        <i class="fa-solid fa-trash text-[11px]"></i>
        <span class="hidden sm:inline text-xs">Bersihkan</span>
      </button>
    </div>
  </header>

  <!-- Chat Area -->
  <main class="flex-1 overflow-y-auto custom-scroll p-4 md:p-6 space-y-6" id="chatBox">
    <!-- Initial welcome message -->
    <div class="flex gap-3 max-w-2xl mr-auto">
      <div class="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] text-cyan-400 flex-shrink-0 mt-0.5">
        AI
      </div>
      <div class="text-sm text-slate-200 leading-relaxed bg-[#161b22] border border-[#21262d] p-3.5 rounded-2xl">
        <p>Halo Mas Bagas. AI lokal aktif dan siap digunakan. Silakan ketik pesan atau ajukan pertanyaan seperti biasa.</p>
      </div>
    </div>
  </main>

  <!-- Bottom Input Bar: Simple & Familiar -->
  <footer class="border-t border-[#21262d] bg-[#161b22] p-3 md:p-4">
    <div class="max-w-3xl mx-auto space-y-2">

      <!-- Attached Image Preview Chip -->
      <div id="imagePreviewBox" class="hidden inline-flex items-center gap-2 p-1.5 pr-2.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-300">
        <img id="previewImg" class="w-7 h-7 object-cover rounded" src="" alt="Thumbnail">
        <span id="previewFileName" class="truncate max-w-[180px]">image.png</span>
        <button onclick="clearAttachedImage()" class="text-slate-400 hover:text-rose-400 ml-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Textarea Input Form -->
      <form onsubmit="sendMessage(event)" class="relative flex items-center bg-[#0d1117] border border-[#30363d] focus-within:border-slate-400 rounded-xl px-2 py-1.5 transition">
        <!-- Attach Image Button -->
        <label class="p-2 text-slate-400 hover:text-slate-200 cursor-pointer rounded-lg hover:bg-slate-800/50 transition" title="Lampirkan Gambar">
          <i class="fa-solid fa-paperclip text-sm"></i>
          <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelected(event)" class="hidden">
        </label>

        <!-- Main Auto-Expanding Textarea -->
        <textarea id="messageInput" rows="1" placeholder="Kirim pesan ke AI lokal..."
          class="flex-1 bg-transparent text-sm text-slate-100 placeholder-slate-500 focus:outline-none px-2.5 py-1.5 resize-none max-h-36 custom-scroll select-text"
          onkeydown="handleKeyDown(event)" oninput="autoResize(this)"></textarea>

        <!-- Send Button -->
        <button type="submit" id="sendBtn" class="p-2 w-8 h-8 rounded-lg bg-slate-100 hover:bg-white text-slate-950 flex items-center justify-center transition disabled:opacity-30 disabled:cursor-not-allowed">
          <i class="fa-solid fa-arrow-up text-xs font-bold"></i>
        </button>
      </form>
      <div class="text-center">
        <span class="text-[11px] text-slate-500">Enter kirim, Shift + Enter baris baru</span>
      </div>
    </div>
  </footer>

  <script>
    const AI_API = '';
    const SUPERVISOR_API = 'http://127.0.0.1:8741';
    let isServerOnline = true;
    let chatHistory = [];
    let attachedImageBase64 = null;
    let attachedImageFileName = null;

    function autoResize(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage(e);
      }
    }

    function handleImageSelected(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        attachedImageBase64 = event.target.result;
        attachedImageFileName = file.name;
        document.getElementById('previewImg').src = attachedImageBase64;
        document.getElementById('previewFileName').innerText = file.name;
        document.getElementById('imagePreviewBox').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function clearAttachedImage() {
      attachedImageBase64 = null;
      attachedImageFileName = null;
      document.getElementById('imageInput').value = '';
      document.getElementById('imagePreviewBox').classList.add('hidden');
    }

    async function loadChatHistory() {
      try {
        const resp = await fetch('/chat/history?project_id=developer_master&limit=100');
        if (resp.ok) {
          const messages = await resp.json();
          if (messages && messages.length > 0) {
            const box = document.getElementById('chatBox');
            box.innerHTML = '';
            chatHistory = [];
            for (const msg of messages) {
              appendMessage(msg.role, msg.content, {
                ir_reply: msg.ir_reply,
                sources: msg.sources
              });
              chatHistory.push({ role: msg.role, content: msg.content });
            }
          }
        }
      } catch (err) {
        console.error('Failed loading chat history:', err);
      }
    }

    async function clearChat() {
      if (!confirm('Hapus seluruh riwayat percakapan developer?')) return;
      try {
        await fetch('/chat/history?project_id=developer_master', { method: 'DELETE' });
      } catch (_) {}
      chatHistory = [];
      const box = document.getElementById('chatBox');
      box.innerHTML = `
        <div class="flex gap-3 max-w-2xl mr-auto">
          <div class="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] text-cyan-400 flex-shrink-0 mt-0.5">
            AI
          </div>
          <div class="text-sm text-slate-200 leading-relaxed bg-[#161b22] border border-[#21262d] p-3.5 rounded-2xl">
            <p>Riwayat percakapan telah dibersihkan. Ada yang bisa saya bantu sekarang, Mas Bagas?</p>
          </div>
        </div>
      `;
    }

    // Health check polling (every 3 seconds)
    async function checkHealth() {
      try {
        const resp = await fetch('/health', { method: 'GET', signal: AbortSignal.timeout(2000) });
        if (resp.ok) {
          setOnlineState(true);
          return;
        }
      } catch (err) {
        // Fallback check via supervisor
        try {
          const supResp = await fetch(`${SUPERVISOR_API}/status`, { signal: AbortSignal.timeout(1500) });
          if (supResp.ok) {
            const data = await supResp.json();
            setOnlineState(data.ai_running);
            return;
          }
        } catch (_) {}
      }
      setOnlineState(false);
    }

    function setOnlineState(online) {
      isServerOnline = online;
      const pill = document.getElementById('statusPill');
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      const banner = document.getElementById('offlineBanner');

      if (online) {
        pill.className = 'flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-emerald-950/70 border border-emerald-800 text-emerald-400 text-[11px] font-medium';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400';
        text.innerText = 'Online';
        banner.classList.add('hidden');
      } else {
        pill.className = 'flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-rose-950/80 border border-rose-800 text-rose-300 text-[11px] font-medium';
        dot.className = 'w-1.5 h-1.5 rounded-full bg-rose-400 animate-pulse';
        text.innerText = 'Offline';
        banner.classList.remove('hidden');
      }
    }

    // Manual start via supervisor
    async function startAiServer() {
      const btn = document.getElementById('bannerStartBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-[10px]"></i> Memulai...';
      try {
        const res = await fetch(`${SUPERVISOR_API}/start`, { method: 'POST' });
        if (res.ok) {
          setTimeout(checkHealth, 2000);
        } else {
          alert('Gagal mengirim sinyal start ke supervisor.');
        }
      } catch (err) {
        alert('Supervisor daemon offline di port 8741. Buka Terminal dan jalankan: ./run.sh');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-play text-[10px]"></i> Jalankan Manual';
      }
    }

    async function restartAiServer() {
      if (!confirm('Restart AI Engine lokal sekarang?')) return;
      try {
        await fetch(`${SUPERVISOR_API}/restart`, { method: 'POST' });
        setOnlineState(false);
        setTimeout(checkHealth, 3000);
      } catch (_) {
        alert('Tidak dapat menghubungi supervisor. Memulai ulang manual melalui server...');
      }
    }

    function appendMessage(role, content, meta = {}) {
      const box = document.getElementById('chatBox');
      const isUser = role === 'user';
      const div = document.createElement('div');
      div.className = 'flex gap-3 max-w-2xl select-text ' + (isUser ? 'ml-auto justify-end' : 'mr-auto');

      let sourceSnippet = '';
      if (meta.sources && meta.sources.length > 0) {
        sourceSnippet = `
          <div class="mt-2 text-[11px] text-slate-400">
            <span class="text-slate-500">Sumber:</span> ${meta.sources.map(s => escapeHtml(s.title || 'Doc')).join(', ')}
          </div>
        `;
      }

      let irSnippet = '';
      if (meta.ir_reply) {
        irSnippet = `
          <div class="mt-2 text-right">
            <button onclick="this.nextElementSibling.classList.toggle('hidden')" class="text-[10px] text-slate-500 hover:text-slate-300 transition">
              [IR Protocol]
            </button>
            <pre class="hidden mt-1 p-2 bg-[#0d1117] border border-slate-800 rounded text-[11px] text-cyan-300 text-left overflow-x-auto">${escapeHtml(meta.ir_reply)}</pre>
          </div>
        `;
      }

      if (isUser) {
        div.innerHTML = `
          <div class="bg-[#21262d] text-slate-100 p-3.5 rounded-2xl text-sm leading-relaxed max-w-xl">
            <div class="whitespace-pre-wrap">${escapeHtml(content)}</div>
          </div>
        `;
      } else {
        div.innerHTML = `
          <div class="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] text-cyan-400 flex-shrink-0 mt-0.5">
            AI
          </div>
          <div class="bg-[#161b22] border border-[#21262d] text-slate-200 p-3.5 rounded-2xl text-sm leading-relaxed max-w-xl flex-1">
            <div class="whitespace-pre-wrap">${escapeHtml(content)}</div>
            ${sourceSnippet}
            ${irSnippet}
          </div>
        `;
      }

      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function sendMessage(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text && !attachedImageBase64) return;

      let fullText = text;
      if (attachedImageBase64) {
        fullText = `[Gambar: ${attachedImageFileName}]
` + fullText;
      }

      appendMessage('user', fullText);
      input.value = '';
      input.style.height = 'auto';
      clearAttachedImage();

      const loadingDiv = document.createElement('div');
      loadingDiv.id = 'loadingMsg';
      loadingDiv.className = 'flex gap-3 max-w-2xl mr-auto text-xs text-slate-400 items-center pl-10';
      loadingDiv.innerHTML = '<i class="fa-solid fa-circle fa-beat text-[8px] text-slate-500 mr-1"></i> Sedang berpikir...';
      document.getElementById('chatBox').appendChild(loadingDiv);
      document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;

      try {
        const resp = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            project_id: 'developer_master',
            message: fullText,
            history: chatHistory.slice(-6),
            remember: false,
            allow_mutations: true
          })
        });

        loadingDiv.remove();

        if (resp.ok) {
          const res = await resp.json();
          appendMessage('assistant', res.answer, {
            ir_reply: res.ir_reply,
            sources: res.sources
          });
          chatHistory.push({ role: 'user', content: fullText });
          chatHistory.push({ role: 'assistant', content: res.answer });
          setOnlineState(true);
        } else {
          const err = await resp.json();
          appendMessage('assistant', `Terjadi kendala: ${err.detail || 'Gagal memproses pesan'}`);
        }
      } catch (err) {
        loadingDiv.remove();
        appendMessage('assistant', 'Tidak dapat terhubung ke AI lokal. Pastikan server aktif.');
        setOnlineState(false);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkHealth();
      loadChatHistory();
      setInterval(checkHealth, 3000);
    });
  </script>
</body>
</html>
